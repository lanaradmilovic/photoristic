# Photo culling configuration.
# Every key here has a default in culling/config.py; this file overrides them.

ingest:
  preview_long_edge: 1536     # px, oriented preview kept for the VLM step (phase 3)
  thumb_long_edge: 320        # px, thumbnail for the HTML report and for embeddings
  jpeg_quality: 88
  workers: 4                  # parallel processes for hashing + preview extraction
  save_every: 100             # write photos.json every N processed photos (resume support)

embedding:
  model_name: facebook/dinov2-small
  batch_size: 32
  device: cpu
  input_size: 224             # px, square input fed to the model

people:
  # Person detection (local, CPU). Photos WITHOUT people (decor, food, details)
  # may use the relaxed nopeople_* grouping rules below: the DINOv2 failure mode
  # "different person, same spot and pose scores 0.85-0.88" cannot occur there.
  enabled: true
  # rtdetr_v2_r18vd replaced yolos-tiny: yolos hallucinated a person on the
  # lemonade jars (9883) and missed the dip-kiss couple entirely (0131).
  # 0.6 verified on talici 4a: real people in odd poses score >= 0.60,
  # hallucinations on blurry decor closeups score <= 0.59.
  model_name: PekingU/rtdetr_v2_r18vd
  score_threshold: 0.6        # detection confidence for a person box
  min_box_area_fraction: 0.02 # ignore tiny background figures (< 2% of the frame)

faces:
  # Face detection + recognition (local ONNX models on CPU, nothing leaves the machine).
  # Faces are clustered per wedding into identities (A, B, C, ... by frequency, so the
  # couple is normally A and B). Grouping uses them: two photos that show exactly the
  # SAME identified people may join under the relaxed faces_* rules below; photos whose
  # identified people do not overlap at all never join (the "different guest, same
  # spot" DINOv2 failure). Set enabled: false to get the pre-faces behaviour.
  enabled: true
  detector_path: models/auraface/scrfd_10g_bnkps.onnx   # SCRFD-10G, 5 keypoints (Apache 2.0)
  embedder_path: models/auraface/glintr100.onnx         # AuraFace = ArcFace ResNet100, 512-d
  det_size: 640               # long edge the 1536 px preview is downscaled to for detection
  det_threshold: 0.5          # detection confidence for a face
  nms_threshold: 0.4
  min_face_size: 24           # px (box side) in the preview; smaller background faces are ignored
  # Cosine similarity between two face embeddings that counts as the same person.
  # Measured on talici 4a (1108 faces): at 0.5 the bride split into frontal (77 faces)
  # + veil/profile clusters; at 0.4 bride and groom are ~100 faces each and still pure;
  # at 0.3 guests start to merge. Check faces_sheets/ after `cull.py faces --sheets`.
  identity_threshold: 0.4
  # Second pass: clusters whose average face (centroid) is at least this similar are
  # the same person. Needed because the first pass keeps tight sub-clusters apart:
  # on Talici 1 the bride with heart sunglasses (228 faces) and without (209) had
  # centroid similarity 0.59, while centroids of different people stay below ~0.35.
  identity_merge_threshold: 0.45
  # An identity counts as a known person for grouping only with at least this many
  # faces; rarer faces are "unknown" and neither relax nor block a merge. Needed
  # because small clusters are often one person's odd angle: on Talici 1 the groom
  # kissing in profile formed a 3-face identity that "differed" from the groom and
  # split the kiss sequence; on 4a one-off faces blocked 26 groups. The couple and
  # the family have tens to hundreds of faces, so 10 keeps them.
  min_identity_faces: 10

grouping:
  # Two consecutive photos (same camera) join the same group if EITHER:
  #   (a) gap <= time_gap_seconds     AND similarity >= similarity_threshold
  #   (b) gap <= extended_gap_seconds AND similarity >= high_similarity_threshold
  # and the new photo's AVERAGE similarity to all photos of the group is at least
  # min_mean_similarity_to_group (stops a slowly changing scene from chaining on).
  # Tuned on the first real wedding (Nikon D5, mostly single frames 2-15 s apart):
  # same-scene neighbours had similarity >= ~0.8, different scenes mostly < 0.7.
  time_gap_seconds: 4.0
  similarity_threshold: 0.75
  extended_gap_seconds: 20.0
  high_similarity_threshold: 0.82
  min_mean_similarity_to_group: 0.70
  # Look-back: a photo may return to an earlier scene (the photographer shot something
  # else in between). An earlier group whose last photo is at most lookback_seconds old
  # is a candidate if the photo's best match in it reaches lookback_similarity_threshold.
  # The photo joins whichever candidate (previous photo's group or look-back group) it
  # is most similar to. A group never spans more than max_group_span_seconds through
  # look-back. Set lookback_seconds: 0 to turn it off.
  # 0.90 because DINOv2 does not tell people apart: a different guest at the same spot
  # and pose scores ~0.85-0.88 (docs/research/2026-10-19-grouping-tuning-4a.md).
  lookback_seconds: 120
  lookback_similarity_threshold: 0.90
  max_group_span_seconds: 180
  # Relaxed rules when NEITHER photo contains a person (requires people.enabled).
  # Tuned on talici 4a: lemonade jars recut at 24 s / 0.85 should merge; the
  # head-table wide vs gift-box closeup pair at 0.853 should NOT (different
  # compositions are deliberate variants, not duplicates) - hence 0.86 lookback.
  nopeople_gap_seconds: 45.0
  nopeople_similarity_threshold: 0.80
  nopeople_lookback_similarity_threshold: 0.86
  # Relaxed rules when BOTH photos show exactly the same identified people (same set
  # of identities AND the same number of detected faces; requires faces.enabled).
  # Set from the Talici 1 couple session: the same couple at the same spot in a new
  # pose scores only 0.72 (8033 -> 8049, 94 s later) and 0.74 (8137 -> 8138, 6 s).
  # Photos with identified people but no identity in common are never joined.
  faces_gap_seconds: 60.0
  faces_similarity_threshold: 0.70
  faces_lookback_similarity_threshold: 0.70
  faces_min_mean_similarity_to_group: 0.65
  # "Same people" normally needs identical sets of known identities. With true, a face
  # that could not be identified (a profile seen too rarely to become an identity) may
  # stand in for a missing known person: {A,B} vs {B} + 1 unknown counts as the same
  # couple. Merges more of a couple session (Talici 1: 8028 -> 8029, the bride in
  # profile) but an unknown face may also be the NEXT guest in a congratulation line.
  faces_same_allows_unknown: false
  # After grouping, a photo at the border of two groups moves to the other group if
  # its average similarity there is higher by more than refine_margin.
  refine_boundaries: true
  refine_margin: 0.02
  # 0 = groups are never split. Cutting at 12 produced ~1/3 of all visible
  # high-similarity boundaries on the talici set (e.g. 9564|9565 at 0.95 / 1 s);
  # any chunking for VLM context limits belongs to the VLM request step, not here.
  max_group_size: 0
  # Groups whose weakest consecutive similarity is below this are highlighted in the report.
  report_low_similarity: 0.85

# Not used yet (phase 3). The client is selected by `provider`.
vlm:
  provider: openai_compatible   # later: bedrock
  base_url: http://localhost:8001/v1   # SSH tunnel; port 8000 here is taken (docs/aws-setup.md)
  model: Intel/Qwen3.5-9B-int4-AutoRound   # 4-bit build for g4dn (T4 16 GB); full model: Qwen/Qwen3.5-9B
  api_key_env: VLM_API_KEY      # env var name; vLLM accepts any value if no key is configured
  timeout_seconds: 120
  max_retries: 3
  image_long_edge: 1024         # previews are downscaled to this before sending (context budget)

# VLM judge for the grey zone of grouping (culling/judge.py, `cull.py judge`).
# Pairs whose DINOv2 similarity falls in the band below are sent to the VLM as one
# side-by-side image; it answers whether the two frames are interchangeable. With
# --dry-run only the pairs and images are written and nothing is sent.
judge:
  sim_low: 0.80               # DINOv2 band where neither thresholds nor faces decide reliably
  sim_high: 0.90              # (half-open: >= low, < high; 0.90 is the people look-back threshold)
  pair_image_long_edge: 768   # px per frame in the pair image (~384 Qwen tokens per frame)
  include_faces_decided: false  # also send pairs where identities already said same/different
  max_pairs: 0                # 0 = all selected pairs
  seconds_per_call: 4.0       # for the dry-run duration estimate; replace with the measured value
